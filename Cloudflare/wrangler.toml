name = "aytroun-store-api"
main = "worker.js"
compatibility_date = "2026-11-17"

[[d1_databases]]
binding = "DB"
database_name = "aytroun-store"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "aytroun-store-images"

[vars]
ALLOWED_ORIGIN = "https://YOUR-GITHUB-USERNAME.github.io"
